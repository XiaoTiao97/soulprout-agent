[package]
name = "soulprout-desktop"
version = "0.1.0"
description = "Soulprout Desktop"
authors = ["Soulprout"]
edition = "2021"

[lib]
name = "soulprout_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "soulprout-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
