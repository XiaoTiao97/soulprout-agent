<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/soulprout_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soulprout Agent</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('soulprout-theme-mode') || 'system';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = mode === 'dark' || (mode === 'system' && sysDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-mode', mode);
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
